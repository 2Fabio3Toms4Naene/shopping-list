<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shopping List</title>
        <link rel="stylesheet" href="./styles.css" type="text/css">
    </head>
    <body>
        <header class="container-head">
            <h1>Welcome to shopping list</h1>
            <button class="button-theme">dark</button>
        </header>
        <main class="container-shopping-list">
            <div class="container-input">
                <label for="input-new-item">Enter a new item to the list:</label>
                <input type="text" id="input-new-item" placeholder="new item">
                <button class="button-add-item">Add item</button>
            </div>
            <div class="container-list">
                <ul class="list">

                </ul>
            </div>
        </main>
        <script src="./shopping-list.js" defer></script>
    </body>
</html>
